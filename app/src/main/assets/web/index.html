    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 3200);
    }

    function toggleLang() {
      state.lang = state.lang === 'ar' ? 'en' : 'ar';
      document.documentElement.lang = state.lang;
      document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
      renderAll();
    }

    function toggleViewportMode() {
      state.mobileFrame = !state.mobileFrame;
      const wrapper = document.getElementById('app-viewport-wrapper');
      const sidebar = document.getElementById('sidebar-nav');
      const btn = document.getElementById('viewport-btn');
      if (state.mobileFrame) {
        wrapper.className = 'max-w-[430px] w-full mx-auto my-4 border-[6px] border-slate-700 rounded-[36px] shadow-2xl bg-slate-950 flex flex-col overflow-hidden h-[840px]';
        sidebar.className = 'w-full bg-slate-900 border-b border-slate-800 p-2 flex flex-row gap-1 overflow-x-auto scrollbar-thin shrink-0';
        btn.textContent = '🖥️ العودة لعرض موقع الويب الكامل';
        showToast('تم التبديل إلى وضع تطبيق الجوال (Mobile App View)');
      } else {
        wrapper.className = 'flex-1 flex flex-col lg:flex-row overflow-hidden transition-all duration-300';
        sidebar.className = 'w-full lg:w-64 bg-slate-900 border-b lg:border-b-0 lg:border-l border-slate-800 p-2 flex lg:flex-col gap-1 overflow-x-auto scrollbar-thin shrink-0';

    function changeBranch(val) {
      state.branchId = val;
      showToast('تم تبديل سياق الفرع النشط وتحديث التسعير والمستودع المرتبط');
      renderAll();
    }

    function changeRole(val) {
      state.role = val;
      showToast('تم تطبيق صلاحيات الدور الوظيفي (RBAC): ' + val);
      renderAll();
    }

    function selectSection(id) {
      state.activeSection = id;
      renderAll();
    }

    function renderSidebar() {
      const nav = document.getElementById('sidebar-nav');
      nav.innerHTML = sections.map(s => {
        const active = state.activeSection === s.id;
        return `
          <button onclick="selectSection('${s.id}')"
            class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-xs font-bold whitespace-nowrap transition text-right w-full ${
              active
                ? 'bg-amber-500 text-slate-950 shadow-lg shadow-amber-500/20'
                : 'text-slate-300 hover:bg-slate-800 hover:text-white'
            }">
            <span class="text-base">${s.icon}</span>
            <span>${state.lang === 'ar' ? s.ar : s.en}</span>
          </button>
        `;
      }).join('');
    }

    function addToCart(prodId) {
      const p = state.products.find(x => x.id === prodId);
      if (!p) return;
      const existing = state.cart.find(x => x.id === prodId);
      if (existing) existing.qty += 1;
      else state.cart.push({ id: p.id, nameAr: p.nameAr, nameEn: p.nameEn, price: p.price, qty: 1, station: p.station, mods: 'تحضير قياسي' });
      showToast(`أضيف إلى السلة: ${p.nameAr}`);
      renderMain();
    }

        return;

      const total = +(subtotal * 1.10).toFixed(2);
      const newOrdId = 'ORD-' + (1045 + state.orders.length);

      state.orders.unshift({
        id: newOrdId,
        type: state.selectedOrderType,
        channel: sourceChannel,
        table: state.selectedOrderType === 'DINE_IN' ? 'T-01' : '-',
        customer: sourceChannel === 'CUSTOMER_APP' ? 'طارق المنصور (تطبيق العميل)' : (state.selectedOrderType === 'DINE_IN' ? 'طاولة T-01' : 'عميل نقطة البيع'),
        total,
        status: 'PREPARING',
        paid: state.offlineMode ? 'QUEUED_OFFLINE' : 'PAID',
        time: 'الآن'
      });

      const stationsMap = {};
      state.cart.forEach(item => {
        if (!stationsMap[item.station]) stationsMap[item.station] = [];
        stationsMap[item.station].push(`${item.qty}x ${item.nameAr}`);
      });
      Object.entries(stationsMap).forEach(([st, items]) => {
        state.kdsTickets.unshift({
          id: 'KDS-' + Math.floor(100 + Math.random() * 899),
          orderId: newOrdId,
          type: `${state.selectedOrderType} (${sourceChannel})`,
          station: st,
          stationAr: `محطة ${st}`,
          items,
          status: 'NEW',
          elapsed: 0,
          sla: 12
        });
      });

      state.inventoryLedger.unshift({
        ref: `SALE-${newOrdId}`,
        type: 'خصم وصفات مبيعات آلي (SALE_CONSUMPTION)',
        item: 'شرائح لحم بلاك أنجوس + خبز بريوش',
        wh: 'مستودع المطبخ الساخن',
        delta: '-0.36 kg',
        after: '144.64 kg',
        by: `OrderEngine (${sourceChannel})`
      });

      state.journals.unshift({
        num: 'JE-2026-0' + (413 + state.journals.length),
        doc: `ORDER #${newOrdId}`,
        desc: `قيد مبيعات وضريبة وتكلفة وصفات آلي (${sourceChannel})`,
        debit: total,
        credit: total,
        lines: [
          `مدين 1010 النقدية/البطاقات: $${total} | دائن 4100 إيرادات المبيعات: $${subtotal.toFixed(2)} | دائن 2100 ضريبة القيمة المضافة: $${(total - subtotal).toFixed(2)}`,
          `مدين 5100 تكلفة البضاعة المباعة (COGS): $${(subtotal * 0.28).toFixed(2)} | دائن 1300 مخزون المواد الغذائية: $${(subtotal * 0.28).toFixed(2)}`
        ]
      });

      state.cart = [];
      showToast(`✅ تم إنشاء الطلب ${newOrdId} وتوجيهه للمطبخ وخصم المخزون وإنشاء القيد المحاسبي آلياً!`);
      renderMain();
    }

    function advanceKdsTicket(ticketId) {
      const t = state.kdsTickets.find(x => x.id === ticketId);
      if (!t) return;
      const flow = ['NEW', 'ACCEPTED', 'PREPARING', 'READY', 'COMPLETED'];
      const idx = flow.indexOf(t.status);
      if (idx < flow.length - 1) {
        t.status = flow[idx + 1];
        showToast(`تم تحديث تذكرة المطبخ ${t.id} إلى ${t.status}`);
        renderMain();
      }
    }

    function cycleTableStatus(tableId) {
      const t = state.tables.find(x => x.id === tableId);
      if (!t) return;
      const states = ['AVAILABLE', 'OCCUPIED', 'RESERVED', 'WAITING_PAYMENT', 'CLEANING', 'UNAVAILABLE'];
      t.status = states[(states.indexOf(t.status) + 1) % states.length];
      showToast(`تم تحديث حالة الطاولة ${t.num} إلى ${t.status}`);
      renderMain();
    }

    function advanceDelivery(delId) {
      const d = state.deliveries.find(x => x.id === delId);
      if (!d) return;
      const flow = ['AWAITING_DRIVER', 'ASSIGNED', 'ACCEPTED', 'ARRIVED_RESTAURANT', 'PICKED_UP', 'ON_ROUTE', 'DELIVERED'];
      const idx = flow.indexOf(d.status);
      if (idx < flow.length - 1) {
        d.status = flow[idx + 1];
        showToast(`تحديث حالة التوصيل ${d.orderId} إلى ${d.status} (OTP: ${d.otp})`);
        renderMain();
      }
    }

    function renderDashboard() {
      const totalSales = state.orders.reduce((s, o) => s + o.total, 0);
      const openTables = state.tables.filter(t => t.status === 'OCCUPIED' || t.status === 'WAITING_PAYMENT').length;
      const activeKds = state.kdsTickets.filter(k => k.status !== 'COMPLETED').length;
      const lowStock = state.stockItems.filter(s => s.low).length;
      return `
        <div class="space-y-6">
          <div class="bg-gradient-to-l from-amber-500/20 via-slate-900 to-slate-900 border border-amber-500/30 rounded-2xl p-5 flex flex-wrap items-center justify-between gap-4">
            <div>
              <h2 class="text-xl md:text-2xl font-extrabold text-white">لوحة القيادة التنفيذية الموحدة (Web & Mobile ERP)</h2>
              <p class="text-xs md:text-sm text-slate-300 mt-1">جميع الأنظمة متصلة بمحرك الطلبات المركزي (Central Order Engine) والمخزون والمحاسبة اللحظية</p>
            </div>
            <div class="flex gap-2">
              <button onclick="selectSection('pos')" class="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs shadow">+ طلب جديد من الكاشير (POS)</button>
              <button onclick="selectSection('kds')" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white font-bold text-xs">شاشة المطبخ (${activeKds})</button>
            </div>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3">
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl"><p class="text-xs text-slate-400">إجمالي المبيعات</p><p class="text-xl font-extrabold text-emerald-400 mt-1">$${totalSales.toFixed(2)}</p></div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl"><p class="text-xs text-slate-400">الطلبات النشطة</p><p class="text-xl font-extrabold text-white mt-1">${state.orders.length} طلبات</p></div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl"><p class="text-xs text-slate-400">الطاولات المشغولة</p><p class="text-xl font-extrabold text-sky-400 mt-1">${openTables} / ${state.tables.length}</p></div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl"><p class="text-xs text-slate-400">طابور المطبخ (KDS)</p><p class="text-xl font-extrabold text-amber-400 mt-1">${activeKds} تذاكر</p></div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl"><p class="text-xs text-slate-400">نواقص المخزون</p><p class="text-xl font-extrabold text-rose-400 mt-1">${lowStock} أصناف</p></div>
            <div class="bg-slate-900 border border-slate-800 p-4 rounded-xl"><p class="text-xs text-slate-400">صافي الربح الموثق</p><p class="text-xl font-extrabold text-emerald-400 mt-1">$6,420.00</p></div>
          </div>
        </div>
      `;
    }

    function renderPos() {
      const subtotal = state.cart.reduce((s, i) => s + i.price * i.qty, 0);
      const vat = +(subtotal * 0.10).toFixed(2);
      const total = +(subtotal + vat).toFixed(2);
      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <div class="lg:col-span-2 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
            ${state.products.map(p => `
              <div onclick="addToCart('${p.id}')" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded-2xl p-4 cursor-pointer">
                <div class="flex justify-between"><span class="text-[10px] text-slate-400">${p.sku}</span><span class="text-xs font-bold text-emerald-400">$${p.price.toFixed(2)}</span></div>
                <h3 class="font-bold text-sm text-white mt-2">${p.nameAr}</h3>
                <p class="text-xs text-slate-400">${p.nameEn}</p>
              </div>
            `).join('')}
          </div>
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
            <h3 class="font-bold text-base text-white">سلة الطلب ($${total.toFixed(2)})</h3>
            <button onclick="submitCentralOrder('POS')" class="w-full py-3 rounded-xl bg-amber-500 text-slate-950 font-extrabold text-sm">✅ إتمام الدفع وإرسال للمطبخ</button>
          </div>
        </div>
      `;
    }

    function renderMain() {
      const main = document.getElementById('main-content');
      const map = { dashboard: renderDashboard, pos: renderPos };
      main.innerHTML = (map[state.activeSection] || renderDashboard)();
    }

    function renderAll() {
      renderSidebar();
      renderMain();
    }

    renderAll();
  </script>
</body>
</html>
